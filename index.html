<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Styrkelogg</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#E8EDEF;--card:#F7F9FA;--ink:#13232C;--mut:#5B6D77;--ac:#1B5E7E;--acink:#fff;--hl:#B47A00;--line:#CBD5DA;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101C22;--card:#18272F;--ink:#E6EEF1;--mut:#8FA3AD;--ac:#4FB0D6;--acink:#08171D;--hl:#F0B429;--line:#2A3B44;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101C22;--card:#18272F;--ink:#E6EEF1;--mut:#8FA3AD;--ac:#4FB0D6;--acink:#08171D;--hl:#F0B429;--line:#2A3B44;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 14px 96px}
h1,h2,h3,.num{font-family:"Barlow Condensed","Arial Narrow",Arial,sans-serif;font-weight:700;margin:0}
h1{font-size:34px;letter-spacing:.2px;margin-bottom:12px}
h2{font-size:24px;margin:18px 0 8px}
h3{font-size:21px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.mut{color:var(--mut);font-size:14px}
.row{display:flex;gap:8px;align-items:center}
.row.sp{justify-content:space-between}
button,select,input{font:inherit;color:inherit}
button{border:0;border-radius:8px;padding:10px 14px;background:var(--ac);color:var(--acink);font-weight:600;cursor:pointer}
button.g{background:transparent;color:var(--ac);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%}
.sets{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 4px 2px 10px;display:flex;align-items:center;gap:4px}
.chip .num{font-size:22px}
.chip button{padding:2px 8px;background:transparent;color:var(--mut);font-size:18px}
.pr{color:var(--hl)}
.big{font-size:40px;line-height:1}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:transparent;color:var(--mut);border-radius:0;padding:14px 4px;font-size:15px}
nav button.on{color:var(--ac);box-shadow:inset 0 3px 0 var(--ac)}
svg{width:100%;height:auto;display:block}
:root:root{--bg:#000;--card:#242424;--ink:#fff;--mut:#9b9b9b;--ac:#5AAEFF;--acink:#000;--hl:#F2C12E;--line:#333;color-scheme:dark}
body{font-size:21px}
h1{font-size:44px}h2{font-size:31px}h3{font-size:27px}
.mut{font-size:18px}
.card{border:0;border-radius:16px;padding:16px}
.chip .num{font-size:29px}
.big{font-size:52px}
button{background:#1E78D2;color:#fff}
nav button{font-size:20px}
main{padding-bottom:140px}
#tm{position:fixed;left:0;right:0;z-index:5}
.tb{position:relative;background:var(--card);border-top:1px solid var(--line)}
.tp{height:6px;transition:width .25s linear}
.tt{font-size:38px;line-height:1.1}
.fl{background:#D12FC1;color:#fff;animation:fl .6s steps(2) infinite}
@keyframes fl{50%{background:#F2C12E;color:#000}}
body.alarm::before{animation:bf .5s 6}
@keyframes bf{50%{filter:hue-rotate(110deg) brightness(1.7)}}
@media (prefers-reduced-motion:reduce){.fl,body.alarm::before{animation:none}}
main{padding-bottom:210px}
main.sm{font-size:15px}
main.sm h1{font-size:31px}main.sm h2{font-size:22px}main.sm h3{font-size:19px}
main.sm .mut{font-size:13px}
main.sm .big{font-size:36px}
main.sm .chip .num{font-size:20px}
main.sm [style*="font-size:29px"]{font-size:20px!important}
main.sm button{font-size:15px;padding:8px 12px}
main.sm input,main.sm select,main.sm textarea{font-size:16px}

/* ===== Liquid glass ===== */
html{background:#05070d}
body{background:transparent;position:relative}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(70% 45% at 10% 0%,rgba(40,120,255,.50),transparent 70%),radial-gradient(55% 40% at 100% 28%,rgba(150,80,255,.34),transparent 70%),radial-gradient(70% 45% at 0% 100%,rgba(0,200,210,.30),transparent 70%),radial-gradient(60% 40% at 100% 100%,rgba(40,120,255,.25),transparent 70%),#05070d}
:root:root{--mut:rgba(235,242,255,.62);--line:rgba(255,255,255,.14)}
.card,nav,.tb{background:linear-gradient(135deg,rgba(255,255,255,.17),rgba(255,255,255,.05) 45%,rgba(255,255,255,.08));-webkit-backdrop-filter:blur(26px) saturate(185%);backdrop-filter:blur(26px) saturate(185%);border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 0 rgba(255,255,255,.06),0 10px 34px rgba(0,0,0,.38)}
.card{border-radius:26px;padding:16px}
button{background:linear-gradient(180deg,rgba(110,185,255,.62),rgba(30,120,210,.62));color:#fff;border:1px solid rgba(255,255,255,.38);border-radius:16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 14px rgba(20,90,200,.35);text-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .12s,filter .12s}
button:active{transform:scale(.97);filter:brightness(1.12)}
button.g{background:rgba(255,255,255,.09);color:#dcecff;border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.22);text-shadow:none}
button:disabled{opacity:.45}
.chip button{background:none;border:0;box-shadow:none;text-shadow:none;border-radius:8px}
input,select,textarea{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:16px;box-shadow:inset 0 2px 6px rgba(0,0,0,.35);color:#fff}
.chip{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);border-radius:14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
[style*="background:var(--bg)"]{background:rgba(255,255,255,.1)!important}
nav{left:12px;right:12px;max-width:536px;margin:0 auto;bottom:calc(10px + env(safe-area-inset-bottom,0px));height:64px;padding:5px;gap:4px;border-radius:32px}
nav button{background:transparent;border:0;box-shadow:none;text-shadow:none;border-radius:27px;padding:0;color:var(--mut)}
nav button.on{background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.1));color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 2px 10px rgba(0,0,0,.3)}
#tm{left:12px;right:12px;max-width:536px;margin:0 auto;bottom:calc(env(safe-area-inset-bottom,0px) + 84px)}
.tb{border-radius:30px;overflow:hidden}
.tb>.row{padding:8px 12px 8px 20px!important}
.tp{height:4px;box-shadow:0 0 10px rgba(90,174,255,.8)}
.tb.fl{background:linear-gradient(135deg,#D12FC1,#8a2be2);color:#fff;animation:fl .6s steps(2) infinite}
@supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){.card,nav,.tb{background:rgba(36,40,52,.92)}}
@media (prefers-reduced-transparency:reduce){.card,nav,.tb{background:rgba(30,34,44,.96);-webkit-backdrop-filter:none;backdrop-filter:none}}
@media (prefers-reduced-motion:reduce){.tb.fl{animation:none}}
</style>
</head>
<body>
<main id="app"></main>
<label style="position:absolute;opacity:0;pointer-events:none" aria-hidden="true"><input type="checkbox" switch id="hp"></label>
<nav>
<button data-t="logg">Økt</button>
<button data-t="prog">Program</button>
<button data-t="frem">Fremgang</button>
<button data-t="data">Data</button>
</nav>
<div id="tm"></div>
<script>
const P={
"Push":["Benkpress|4×6–8","Skråbenk hantler|3×8–10","Skulderpress|3×8–10","Sidehev|3×12–15","Triceps pushdown|3×10–12"],
"Pull":["Markløft|3×5","Pull-ups|4×6–8","Skråro|3×8–10","Face pull|3×12–15","Bicepscurl|3×10–12"],
"Bein":["Knebøy|4×6–8","Rumensk markløft|3×8–10","Benpress|3×10–12","Utfall|3×10","Tåhev|4×12–15"],
"Helkropp":["Knebøy|3×5","Benkpress|3×5","Skråro|3×8","Skulderpress|3×8","Planke|3×45 sek"]
};
let db={sessions:[],draft:null,custom:[]},tab="logg",sel="",armed=false,msg="",nt="",pk=false,q="",cloud=null,qp=Promise.resolve();
try{const s=JSON.parse(localStorage.getItem("sl")||"null");if(s&&s.sessions)db=s}catch(e){}db.custom=db.custom||[];if(db.programs){for(const k in P)delete P[k];Object.assign(P,db.programs)}db.programs=P;db.ren=db.ren||{};db.sessions.forEach(s=>{if(s.name==="Tom økt")s.name="Friøkt"});if(db.draft&&db.draft.name==="Tom økt")db.draft.name="Friøkt";
const save=()=>{try{localStorage.setItem("sl",JSON.stringify(db))}catch(e){}if(cloud){const j=JSON.stringify(db);qp=qp.then(()=>cloud.set({json:j,at:Date.now()})).catch(()=>{})}};
function merge(o){const ids=new Set(db.sessions.map(s=>s.id));(o.sessions||[]).forEach(s=>{if(!ids.has(s.id))db.sessions.push(s)});db.sessions.sort((a,b)=>a.id-b.id);db.custom=[...new Set([...db.custom,...(o.custom||[])])];if(o.programs)for(const k in o.programs)if(!P[k])P[k]=o.programs[k];if(o.restEx){db.restEx=db.restEx||{};for(const k in o.restEx)if(!(k in db.restEx))db.restEx[k]=o.restEx[k]}if(o.ren)db.ren=Object.assign({},o.ren,db.ren||{})}

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const e1=(w,r)=>w*(1+r/30);
const fmt=d=>new Date(d).toLocaleDateString("nb-NO",{day:"numeric",month:"short"});
const kg=n=>(Math.round(n*10)/10).toString().replace(".",",");
function lastSets(ex){for(let i=db.sessions.length-1;i>=0;i--){const e=db.sessions[i].entries.find(x=>x.ex===ex);if(e&&e.sets.length)return e.sets}return null}
function go(t){tab=t;armed=false;nt="";vs=null;render();window.scrollTo(0,0)}
function start(n){if(db.draft){go("logg");return}pk=!P[n];db.draft={t0:Date.now(),name:n,entries:(P[n]||[]).map(s=>{const a=s.split("|");return{ex:a[0],t:a[1],sets:[]}})};save();go("logg")}
function addSet(i){const w=parseFloat($("#w"+i).value.replace(",",".")),r=parseInt($("#r"+i).value);
if(isNaN(w)||!(r>0)){msg="Fyll inn vekt og reps";render();return}
msg="";pre=null;db.draft.entries[i].sets.push({w,r});save();curEx=db.draft.entries[i].ex;render();tDraw();if(rs().auto)tStart(exRest(curEx))}
function rmSet(i,j){db.draft.entries[i].sets.splice(j,1);save();render()}
function addEx(n){if(!db.draft.entries.some(e=>e.ex===n))db.draft.entries.push({ex:n,t:"",sets:[]});pk=false;save();render()}
function addCustom(n){if(!db.custom.includes(n))db.custom.push(n);addEx(n)}
const CAT=["Knebøy","Benkpress","Markløft","Skulderpress","Militærpress","Pull-ups","Chins","Skråro","Roing med stang","Nedtrekk","Rumensk markløft","Benpress","Utfall","Bulgarsk splittknebøy","Hip thrust","Tåhev","Sidehev","Face pull","Bicepscurl","Triceps pushdown","Skråbenk hantler","Hantelpress","Dips","Kabelfly","Leg curl","Leg extension","Planke","Farmers walk","Kettlebell swing"];
function ranked(){const c={};db.sessions.forEach(s=>s.entries.forEach(e=>c[e.ex]=(c[e.ex]||0)+1));return [...new Set([...CAT.map(x=>(db.ren||{})[x]||x),...db.custom,...Object.keys(c)])].map(n=>({n,c:c[n]||0})).sort((a,b)=>b.c-a.c||a.n.localeCompare(b.n,"nb"))}
function finish(){const en=db.draft.entries.filter(e=>e.sets.length);
if(!en.length){msg="Logg minst ett sett først";render();return}
const dm=parseInt($("#dur").value),dur=(dm>0?dm:Math.min(240,Math.max(10,Math.round((Date.now()-(db.draft.t0||Date.now()))/60000))))*60;const ed=db.draft.editId,ix=ed?db.sessions.findIndex(x=>x.id===ed):-1;if(ix>=0){const o=db.sessions[ix],dv=$("#dt")&&$("#dt").value;db.sessions[ix]={id:o.id,date:dv?new Date(dv+"T12:00:00").toISOString():o.date,dur:dm>0?dm*60:o.dur,name:($("#nm")&&$("#nm").value.trim())||o.name,entries:en}}else db.sessions.push({id:Date.now(),date:new Date().toISOString(),dur,name:db.draft.name,entries:en});db.draft=null;msg="";save();sel="";go("frem")}
function drop(){if(!armed){armed=true;render();return}const ed=db.draft.editId;db.draft=null;save();go(ed?"frem":"logg")}
function pick(v){sel=v;render()}
function chart(pts){
if(pts.length<2)return '<p class="mut">Logg øvelsen i minst to økter for å se kurven.</p>';
const W=320,H=150,p=26,v=pts.map(x=>x.v);let lo=Math.min(...v),hi=Math.max(...v);if(hi===lo){hi+=1;lo-=1}
const X=i=>p+i*(W-2*p)/(pts.length-1),Y=y=>H-p-(y-lo)/(hi-lo)*(H-2*p);
const l=pts.map((q,i)=>X(i)+","+Y(q.v)).join(" ");
return '<svg viewBox="0 0 '+W+" "+H+'" role="img" aria-label="Estimert 1RM over tid"><polyline points="'+l+'" fill="none" stroke="var(--ac)" stroke-width="2.5"/>'+
pts.map((q,i)=>'<circle cx="'+X(i)+'" cy="'+Y(q.v)+'" r="3.5" fill="var(--ac)"/>').join("")+
'<text x="2" y="'+(Y(hi)+4)+'" font-size="14" fill="var(--mut)">'+Math.round(hi)+'</text><text x="2" y="'+(Y(lo)+4)+'" font-size="14" fill="var(--mut)">'+Math.round(lo)+'</text></svg>'}
function vLogg(){
if(!db.draft)return '<h1>Økt</h1>'+bkBanner()+'<div class="card"><p>Ingen aktiv økt.</p><div class="row"><button onclick="go(\'prog\')">Velg program</button><button class="g" onclick="start(\'Friøkt\')">Friøkt</button></div></div>'+
(db.sessions.length?'<p class="mut">Sist: '+esc(db.sessions[db.sessions.length-1].name)+", "+fmt(db.sessions[db.sessions.length-1].date)+"</p>":"");
const d=db.draft;let h='<h1>'+esc(d.name)+"</h1>";if(d.editId)h+='<div class="card"><input id="nm" value="'+esc(d.name)+'" aria-label="Navn"><div style="height:8px"></div><input id="dt" type="date" value="'+day(d.date)+'" aria-label="Dato"></div>';
d.entries.forEach((e,i)=>{
const prev=lastSets(e.ex),cur=(pre&&pre.i===i&&pre)||e.sets[e.sets.length-1]||(prev&&prev[prev.length-1]);const prevB=prevBest(e.ex,d.editId||Infinity);
h+='<div class="card"><div class="row sp"><h3>'+esc(e.ex)+'</h3><span class="mut">'+esc(e.t)+'</span><button class="g" aria-label="Slett øvelse" onclick="rmEx('+i+')">Slett</button></div>'+
(prev?'<div class="mut">Sist: '+prev.map(s=>kg(s.w)+"×"+s.r).join(", ")+"</div>":"")+
'<div class="sets">'+e.sets.map((s,j)=>'<span class="chip"><button class="num" style="background:none;color:inherit;padding:2px 4px" aria-label="Rediger sett" onclick="edSet('+i+","+j+')">'+kg(s.w)+" × "+s.r+(prevB>0&&e1(s.w,s.r)>Math.max(prevB,...e.sets.slice(0,j).map(x=>e1(x.w,x.r)))?' <span class="pr">★</span>':"")+'</button><button aria-label="Fjern sett" onclick="rmSet('+i+","+j+')">×</button></span>').join("")+"</div>"+
'<div class="row" style="margin:6px 0"><span class="mut">Pause</span><button class="g" style="padding:6px 12px" onclick="exR('+i+',-30)">−</button><b>'+mmss(exRest(e.ex))+'</b><button class="g" style="padding:6px 12px" onclick="exR('+i+',30)">+</button></div>'+
'<div class="row" style="align-items:flex-start"><div style="flex:1"><div class="mut" style="font-size:14px">kg</div><input id="w'+i+'" inputmode="decimal" placeholder="kg" aria-label="Vekt i kg" value="'+(cur?kg(cur.w):"")+'"><div class="row" style="margin-top:6px"><button class="g" style="flex:1;padding:8px 4px" onclick="adjW('+i+',-2.5)">−2,5</button><button class="g" style="flex:1;padding:8px 4px" onclick="adjW('+i+',2.5)">+2,5</button></div></div><div style="flex:1"><div class="mut" style="font-size:14px">reps</div><input id="r'+i+'" inputmode="numeric" placeholder="reps" aria-label="Repetisjoner" value="'+(cur?cur.r:"")+'"><div class="row" style="margin-top:6px"><button class="g" style="flex:1;padding:8px 4px" onclick="adjR('+i+',-1)">−1</button><button class="g" style="flex:1;padding:8px 4px" onclick="adjR('+i+',1)">+1</button></div></div></div><button style="width:100%;margin-top:8px" onclick="addSet('+i+')">Legg til sett</button></div>'});

h+=pk?'<div class="card"><div class="row"><input id="q" placeholder="Søk eller skriv egen øvelse" value="'+esc(q)+'" oninput="q=this.value;$(\'#pl\').innerHTML=plist()"><button class="g" onclick="pk=false;render()">Ferdig</button></div><div id="pl" style="max-height:280px;overflow:auto;margin-top:8px">'+plist()+'</div></div>':'<button class="g" onclick="pk=true;q=\'\';render()">+ Legg til øvelse</button>';h+='<div class="row" style="margin-top:12px"><label class="mut" for="dur">Varighet (min)</label><input id="dur" inputmode="numeric" style="width:90px" placeholder="'+(d.dur?Math.round(d.dur/60):"auto")+'"></div>';
if(msg)h+='<p class="pr" role="alert">'+msg+"</p>";
h+='<div class="row" style="margin-top:14px"><button onclick="finish()">'+(d.editId?"Lagre endringer":"Fullfør økt")+'</button><button class="g" onclick="drop()">'+(armed?"Trykk igjen for å forkaste":"Forkast")+"</button></div>";
return h}
function vProg(){let h="<h1>Program</h1>";
for(const n in P){h+='<div class="card"><div class="row sp"><h3>'+n+'</h3><button onclick="start(\''+n+'\')">Start økt</button></div><ul class="mut" style="margin:8px 0 0;padding-left:18px">'+P[n].map(s=>{const a=s.split("|");return"<li>"+a[0]+" – "+a[1]+"</li>"}).join("")+"</ul></div>"}
return h}
function vFrem(){const S=db.sessions;let h="<h1>Fremgang</h1>"+bkBanner();const vsx=vs&&S.find(x=>x.id===vs);if(vsx)return vDet(vsx);vs=null;
if(!S.length)return h+'<div class="card"><p>Ingen fullførte økter ennå. Start en økt under Program, så dukker rekorder og kurver opp her.</p></div>';
const wk=S.filter(s=>Date.now()-new Date(s.date)<7*864e5).length;
h+='<div class="row"><div class="card" style="flex:1"><div class="num big">'+S.length+'</div><div class="mut">økter totalt</div></div><div class="card" style="flex:1"><div class="num big">'+wk+'</div><div class="mut">siste 7 dager</div></div></div>';
h+=vWeek(S);const exs=[...new Set(S.flatMap(s=>s.entries.map(e=>e.ex)))];if(!exs.includes(sel))sel=exs[0];
h+='<select aria-label="Velg øvelse" onchange="pick(this.value)">'+exs.map(x=>'<option'+(x===sel?" selected":"")+' value="'+esc(x)+'">'+esc(x)+"</option>").join("")+"</select>";
const pts=[];let top=null,best=0;
S.forEach(s=>{const e=s.entries.find(x=>x.ex===sel);if(!e)return;let b=0;e.sets.forEach(t=>{const v=e1(t.w,t.r);if(v>b)b=v;if(!top||t.w>top.w||(t.w===top.w&&t.r>top.r))top=t});if(b>best)best=b;pts.push({v:b})});

window.addEventListener("resize",()=>tDraw());
function tExt(){rs().ext=!rs().ext;save();render()}
function runSc(sec){try{const a=document.createElement("a");a.href="shortcuts://run-shortcut?name=Pause&input=text&text="+Math.round(sec);a.style.display="none";document.body.appendChild(a);a.click();a.remove()}catch(e){}}
function exRest(ex){return((db.restEx||{})[ex])||rs().sec}
function exR(i,d){const ex=db.draft.entries[i].ex;db.restEx=db.restEx||{};db.restEx[ex]=Math.max(30,Math.min(1800,exRest(ex)+d));curEx=ex;save();render();tDraw()}
function adjW(i,d){const e=$("#w"+i);let v=parseFloat((e.value||"0").replace(",","."));if(isNaN(v))v=0;e.value=kg(Math.max(0,Math.round((v+d)*100)/100));curEx=db.draft.entries[i].ex;tDraw()}
function adjR(i,d){const e=$("#r"+i);e.value=Math.max(1,(parseInt(e.value)||0)+d);curEx=db.draft.entries[i].ex;tDraw()}
function prevBest(ex,beforeId){let b=0;db.sessions.forEach(s=>{if(s.id<beforeId)s.entries.forEach(e=>{if(e.ex===ex)e.sets.forEach(t=>{const v=e1(t.w,t.r);if(v>b)b=v})})});return b}
function wkStart(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x}
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())),n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y0)/864e5+1)/7)}
function vWeek(S){const ws=wkStart(new Date()),dn=["M","T","O","T","F","L","S"],cnt={},td=new Date().toDateString();
S.forEach(s=>{const k=new Date(s.date).toDateString();cnt[k]=(cnt[k]||0)+1});
let h='<div class="card"><h3>Uke '+isoWeek(new Date())+'</h3><div class="row sp" style="margin-top:8px">';
for(let i=0;i<7;i++){const d=new Date(ws);d.setDate(ws.getDate()+i);const c=cnt[d.toDateString()]||0;
h+='<div style="text-align:center;flex:1"><div class="mut">'+dn[i]+'</div><div class="num" style="font-size:18px;width:34px;height:34px;line-height:34px;margin:4px auto 0;border-radius:50%;'+(c?"background:var(--ac);color:#000":"background:var(--bg)")+(d.toDateString()===td?";outline:2px solid var(--mut)":"")+'">'+d.getDate()+"</div></div>"}
h+="</div>";const wk=[];
for(let i=7;i>=0;i--){const a=new Date(ws);a.setDate(ws.getDate()-7*i);const b=new Date(a);b.setDate(a.getDate()+7);wk.push({w:isoWeek(a),n:S.filter(s=>{const t=new Date(s.date);return t>=a&&t<b}).length})}
const mx=Math.max(3,...wk.map(x=>x.n));
h+='<div class="row" style="align-items:flex-end;margin-top:14px">'+wk.map(x=>'<div style="flex:1;text-align:center"><div style="height:'+Math.max(3,Math.round(x.n/mx*44))+'px;background:'+(x.n?"var(--ac)":"var(--line)")+';border-radius:3px;margin:0 3px"></div><div class="mut" style="font-size:11px">'+x.w+"</div></div>").join("")+'</div><div class="mut" style="margin-top:4px">Økter per uke, siste 8 uker</div></div>';
return h}
function bkBanner(){if(!db.sessions.length)return"";const ref=db.lastBackup?new Date(db.lastBackup):new Date(db.sessions[0].date),d=Math.floor((Date.now()-ref)/864e5);if(d<7)return"";
return'<div class="card" style="border-left:4px solid var(--hl)"><div class="row sp"><div>'+(db.lastBackup?"Siste backup var for "+d+" dager siden.":"Du har ikke tatt backup ennå.")+'</div><button data-t="data" onclick="go(this.dataset.t)">Backup</button></div></div>'}
let curEx=null;
function ce(){const d=db.draft;if(!d||!d.entries.length)return null;return d.entries.some(e=>e.ex===curEx)?curEx:d.entries[0].ex}
function bR(){const x=ce();return x?exRest(x):rs().sec}
function setRest(d){const x=ce();if(x){db.restEx=db.restEx||{};db.restEx[x]=Math.max(30,Math.min(1800,exRest(x)+d))}else{rs().sec=Math.max(30,Math.min(1800,rs().sec+d))}save();render()}
function tBar(){rs().bar=(rs().bar===false);save();render();tDraw()}
function tSave(){try{localStorage.setItem("slt",tm.st==="run"?JSON.stringify({end:tm.end,tot:tm.tot}):"")}catch(e){}}
function tRestore(){try{const x=JSON.parse(localStorage.getItem("slt")||"null");if(x&&x.end>Date.now()){tm.st="run";tm.end=x.end;tm.tot=x.tot;tm.last=-1;clearInterval(tm.iv);tm.iv=setInterval(tick,250)}}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden){tick();tDraw()}});
window.addEventListener("pageshow",()=>{tRestore();tick();tDraw()});
function render(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
const sy=window.scrollY;$("#app").className=tab==="data"||tab==="frem"?"sm":"";$("#app").innerHTML=tab==="logg"?vLogg():tab==="prog"?vProg():tab==="data"?vData():vFrem();window.scrollTo(0,sy)}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.t));
render();tDraw();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script>
</body>
</html>
